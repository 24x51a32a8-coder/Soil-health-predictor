<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem("shp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results - Soil Health Predictor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-bg-crop">

<nav class="navbar navbar-expand-lg navbar-farm">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fa-solid fa-seedling me-2"></i>Soil Health Predictor</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a href="/dashboard.html" class="text-white text-decoration-none"><i class="fa-solid fa-house me-1"></i>Dashboard</a>
      <a href="#" class="btn btn-farm-outline btn-sm" onclick="logoutFarmer()">Logout</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div id="resultsLoading" class="text-center py-5">
    <div class="spinner-border spinner-farm" role="status"></div>
    <p class="mt-3 text-muted">Analyzing your soil data...</p>
  </div>

  <div id="resultsContent" class="hidden">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4 fade-in-up">
      <h4 class="mb-0" style="font-family:'Playfair Display',serif;">Your Soil Analysis Report</h4>
      <button id="downloadReportBtn" class="btn btn-farm-earth"><i class="fa-solid fa-download me-1"></i>Download Report (PDF)</button>
    </div>

    <!-- Score -->
    <div class="card-farm p-4 mb-4 text-center fade-in-up">
      <h5 class="mb-3" data-i18n="soil_health_score">Soil Health Score</h5>
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="70" fill="none" stroke="#e0e0e0" stroke-width="14"/>
        <circle id="scoreCircle" cx="90" cy="90" r="70" fill="none" stroke="#2e7d32" stroke-width="14"
                stroke-linecap="round" transform="rotate(-90 90 90)" style="transition:stroke-dashoffset 1s ease;"/>
        <text id="scoreText" x="90" y="98" text-anchor="middle" font-size="26" font-weight="800" fill="#23342b">0/100</text>
      </svg>
    </div>

    <!-- Nutrient chart -->
    <div class="card-farm p-4 mb-4 fade-in-up">
      <h5 class="mb-3">Nutrient Levels</h5>
      <canvas id="nutrientChart" height="100"></canvas>
    </div>

    <!-- Solutions -->
    <h5 class="mb-3" data-i18n="solutions_title">Soil Solutions</h5>
    <div id="solutionsContainer" class="mb-4"></div>

    <div class="text-center mb-5">
      <a href="/dashboard.html" class="btn btn-farm-earth"><i class="fa-solid fa-arrow-left me-1"></i>Back to Dashboard</a>
      <a href="/new-prediction.html" class="btn btn-farm ms-2"><i class="fa-solid fa-plus me-1"></i>New Prediction</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/results.js"></script>
</body>
</html>
