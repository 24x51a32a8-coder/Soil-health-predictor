<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem("shp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Soil Health Predictor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="logo"><i class="fa-solid fa-seedling me-2"></i>Soil Health Predictor</div>
      <p class="text-muted">Reset your password</p>
    </div>
    <form id="forgotForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold" data-i18n="email">Email Address</label>
        <input type="email" id="forgotEmail" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-farm w-100">Send Reset Link</button>
      <p class="text-center small mt-3">
        <a href="/login.html" style="color:var(--green);font-weight:600;"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
      </p>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
