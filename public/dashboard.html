<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem("shp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Soil Health Predictor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-bg-crop">

<nav class="navbar navbar-expand-lg navbar-farm">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fa-solid fa-seedling me-2"></i>Soil Health Predictor</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <select class="form-select form-select-sm" style="border-radius:20px;width:80px;" onchange="switchLanguage(this.value)">
        <option value="en">EN</option><option value="te">TE</option><option value="hi">HI</option>
      </select>
      <a href="#" class="btn btn-farm-outline btn-sm" onclick="logoutFarmer()"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="sidebar-farm fade-in-up">
        <a href="/dashboard.html" class="active"><i class="fa-solid fa-house"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
        <a href="/new-prediction.html"><i class="fa-solid fa-flask"></i> <span data-i18n="new_prediction">New Prediction</span></a>
        <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
    <div class="col-lg-9">
      <div class="card-farm p-4 mb-4 fade-in-up" style="background:var(--gradient-primary);color:#fff;">
        <h3 style="font-family:'Playfair Display',serif;"><span data-i18n="dashboard_welcome">Welcome back</span>, <span id="farmerName"></span> <i class="fa-solid fa-leaf"></i></h3>
        <p class="mb-0 opacity-75">Track your soil health and grow smarter.</p>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="stat-card fade-in-up" style="background:var(--gradient-primary);">
            <div class="d-flex justify-content-between align-items-center">
              <div><p class="mb-1 opacity-75">Total Predictions</p><h3 id="historyCount">0</h3></div>
              <i class="fa-solid fa-clipboard-list fa-2x opacity-75"></i>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="stat-card fade-in-up" style="background:var(--gradient-earth);">
            <div class="d-flex justify-content-between align-items-center">
              <div><p class="mb-1 opacity-75">Average Soil Score</p><h3 id="avgScore">0</h3></div>
              <i class="fa-solid fa-gauge-high fa-2x opacity-75"></i>
            </div>
          </div>
        </div>
      </div>

      <div id="trendChartWrapper" class="card-farm p-4 mb-4 hidden fade-in-up">
        <h5 class="mb-3"><i class="fa-solid fa-chart-line me-2"></i>Soil Health Trend</h5>
        <canvas id="trendChart" height="90"></canvas>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0" data-i18n="my_history">My History</h5>
        <a href="/new-prediction.html" class="btn btn-farm btn-sm"><i class="fa-solid fa-plus me-1"></i><span data-i18n="new_prediction">New Prediction</span></a>
      </div>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="/js/lang.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
