<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem("shp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Soil Health Predictor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="logo"><i class="fa-solid fa-seedling me-2"></i>Soil Health Predictor</div>
      <p class="text-muted" data-i18n="login_title">Farmer Login</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold" data-i18n="login_identifier">Phone Number or Email</label>
        <input type="text" id="identifier" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" data-i18n="password">Password</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <div class="text-end mb-3">
        <a href="/forgot-password.html" class="small" style="color:var(--green);" data-i18n="forgot_password">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-farm w-100" data-i18n="login_btn">Login</button>
      <p class="text-center small mt-3">
        <span data-i18n="no_account">Don't have an account?</span>
        <a href="/register.html" style="color:var(--green);font-weight:600;" data-i18n="nav_register">Register</a>
      </p>
      <p class="text-center small mt-2">
        <a href="/admin-login.html" class="text-muted"><i class="fa-solid fa-user-shield me-1"></i>Admin Login</a>
      </p>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
