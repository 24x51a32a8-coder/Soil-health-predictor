<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem("shp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Soil Health Predictor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<style>
.auth-wrapper {
  background-image:
    linear-gradient(180deg, rgba(239, 231, 225, 0.88), rgba(224, 209, 197, 0.92)),
    url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1600&q=70') !important;
  background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
}
</style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="logo"><i class="fa-solid fa-user-shield me-2"></i>Admin Panel</div>
      <p class="text-muted" data-i18n="admin_login_title">Admin Login</p>
    </div>
    <form id="adminLoginForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold" data-i18n="phone_number">Phone Number</label>
        <input type="tel" id="adminPhone" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" data-i18n="password">Password</label>
        <input type="password" id="adminPassword" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" data-i18n="admin_secret_code">Secret Admin Code</label>
        <input type="text" id="adminSecretCode" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-farm-earth w-100" data-i18n="login_btn">Login</button>
      <p class="text-center small mt-3">
        <a href="/login.html" class="text-muted"><i class="fa-solid fa-arrow-left me-1"></i>Back to Farmer Login</a>
      </p>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
